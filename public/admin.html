<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesty · Panel</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#0e1742">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafb;--card:#fff;--ink:#0e1742;--muted:#6a7287;--line:#e4e2da;--cream:#f4f1e9;--brand:#e93b74;--brand-d:#d12a62;--navy:#0e1742;--ok:#16a34a;--warn:#d97706;--err:#dc2626}
*{box-sizing:border-box}
h1,h2,header b{font-family:'Plus Jakarta Sans',Inter,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:var(--navy);color:#fff}header .btn,header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
header b{color:#fff;font-size:22px;font-weight:800;letter-spacing:-.5px}header b i{color:var(--brand);font-style:normal}
main{max-width:1000px;margin:0 auto;padding:24px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 6px 24px rgba(14,23,66,.05)}
h1{font-size:28px;margin:0 0 4px;font-weight:800;letter-spacing:-.7px}h2{font-size:18px;margin:0 0 10px;font-weight:700}
.muted{color:var(--muted)}
button,.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 14px;text-decoration:none;display:inline-block}
button.primary,.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.danger{color:var(--err)}
button.sm{padding:4px 10px;font-size:13px}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit}
select{background:#fff}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{color:var(--muted);font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.kbsw{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;border-radius:99px;border:1px solid transparent;font-weight:700;font-size:13px;color:#fff;cursor:pointer;transition:background .2s}
.kbsw.on{background:var(--ok)}.kbsw.off{background:var(--err)}
.kbsw .dot{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.kbsw.off{flex-direction:row}.kbsw.on{flex-direction:row-reverse;padding:5px 6px 5px 14px}
.kbsw:disabled{opacity:.6;cursor:wait}
.pill.off{background:var(--line);color:var(--muted)}
.link{font-family:ui-monospace,monospace;font-size:13px;background:var(--cream);padding:3px 8px;border-radius:6px;word-break:break-all}
.err{color:var(--err);font-size:14px}
.ans{padding:10px 0;border-bottom:1px solid var(--line)}
.ans .l{font-weight:600}.ans .a{white-space:pre-wrap;margin-top:2px}
.sec{margin:22px 0 4px;color:var(--brand);font-weight:800}
.item{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:var(--cream)}
.item .grid{display:grid;grid-template-columns:1fr 170px;gap:8px}
@media(max-width:600px){.item .grid{grid-template-columns:1fr}}
label.s{font-size:12px;color:var(--muted);display:block;margin:6px 0 2px}
.login{max-width:380px;margin:90px auto}
</style>
</head>
<body>
<header><b>encuesty<i>.</i></b><div id="hdr"></div></header>
<main id="app"></main>
<script src="/static/render.js"></script>
<script>
const $ = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => d ? new Date(d).toLocaleString('es', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
async function api(path, opts = {}) {
  const r = await fetch('/api/admin' + path, { credentials: 'same-origin', headers: opts.body ? {'Content-Type':'application/json'} : {}, ...opts });
  if (r.status === 401) { renderLogin(); throw new Error('auth'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}
function renderLogin(msg = '') {
  document.getElementById('hdr').innerHTML = '';
  $.innerHTML = `<div class="card login"><h1>Panel de Encuesty</h1><p class="muted">Inicia sesión para administrar tus cuestionarios.</p>
    <form id="f"><label class="s">Correo</label><input type="email" id="e" required autofocus>
    <label class="s">Contraseña</label><input type="password" id="p" required>
    <p class="err" id="m">${esc(msg)}</p><button class="primary" style="width:100%">Entrar</button></form></div>`;
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    try { await fetch('/api/admin/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: e.value, password: p.value }) }).then(async r => { if (!r.ok) throw new Error((await r.json()).error); }); route(); }
    catch (er) { document.getElementById('m').textContent = er.message; }
  };
}
async function logout() { await fetch('/api/admin/logout', { method: 'POST' }); renderLogin(); }
function hdr() { document.getElementById('hdr').innerHTML = '<a class="btn" href="#/">Cuestionarios</a> <a class="btn" href="#/clientes">Clientes</a> <button onclick="logout()">Salir</button>'; }

/* ---------- lista de cuestionarios ---------- */
async function viewList() {
  const { surveys, baseUrl } = await api('/surveys'); hdr();
  $.innerHTML = `<div class="spread"><div><h1>Cuestionarios</h1><p class="muted">Cada cuestionario tiene su propio enlace para enviar a tus clientes.</p></div>
    <div class="row"><button onclick="copy('${esc(baseUrl)}/mi-empresa',this)" title="Para tus clientes existentes: entran con su correo, su nombre y su empresa y llenan sus proyectos y preguntas frecuentes">Compartir enlace de Mi empresa</button>
    <button class="primary" onclick="newSurvey()">+ Nuevo cuestionario</button></div></div>
    ${surveys.map(s => `<div class="card"><div class="spread"><div>
      <h2>${esc(s.title)} <span class="pill ${s.published ? 'ok' : 'off'}">${s.published ? 'Activo' : 'Pausado'}</span></h2>
      <div class="row"><span class="link">${esc(baseUrl)}/s/${esc(s.slug)}</span> <button class="sm" onclick="copy('${esc(baseUrl)}/s/${esc(s.slug)}',this)">Copiar enlace</button></div>
      <p class="muted" style="margin:8px 0 0">${s.total} cliente(s) · ${s.completed} completado(s) · ${s.total - s.completed} en curso</p></div>
      <div class="row"><a class="btn primary" href="#/s/${s.id}">Respuestas</a><a class="btn" href="#/editar/${s.id}">Editar preguntas</a></div></div></div>`).join('') || '<div class="card muted">Aún no hay cuestionarios.</div>'}`;
}
function copy(t, b) { navigator.clipboard.writeText(t); const o = b.textContent; b.textContent = '¡Copiado!'; setTimeout(() => b.textContent = o, 1500); }
async function newSurvey() {
  const title = prompt('Nombre del cuestionario:'); if (!title) return;
  const s = await api('/surveys', { method: 'POST', body: JSON.stringify({ title }) });
  location.hash = '#/editar/' + s.id;
}

/* ---------- respuestas de un cuestionario ---------- */
async function viewResponses(id) {
  const [{ responses }, s, list] = await Promise.all([api(`/surveys/${id}/responses`), api('/surveys/' + id), api('/surveys')]); hdr();
  const link = `${list.baseUrl}/s/${s.slug}`;
  $.innerHTML = `<p><a href="#/" style="color:var(--brand)">← Cuestionarios</a></p><div class="spread"><div><h1>${esc(s.title)}</h1><div class="row"><span class="link">${esc(link)}</span><button class="sm" onclick="copy('${esc(link)}',this)">Copiar</button></div></div>
    <a class="btn" href="/api/admin/surveys/${id}/export.csv">Descargar CSV</a></div><br>
    <div class="card" style="overflow:auto"><table><tr><th>Cliente</th><th>Correo</th><th>Estado</th><th>Paso</th><th>Archivos</th><th>Actualizado</th><th></th></tr>
    ${responses.map(r => `<tr><td>${esc(r.name)}${r.shared ? ' <span title="Enlace público activo">🔗</span>' : ''}</td><td>${esc(r.email)}</td>
      <td><span class="pill ${r.status === 'completed' ? 'ok' : 'warn'}">${r.status === 'completed' ? 'Completado' : 'En curso'}</span></td>
      <td>${r.step + 1}</td><td>${r.files || ''}</td><td>${fmt(r.updated_at)}</td><td><a class="btn sm" href="#/respuestas/${r.id}">Ver</a></td></tr>`).join('') || '<tr><td colspan="7" class="muted">Todavía nadie ha abierto este cuestionario.</td></tr>'}</table></div>`;
}
async function viewResponse(id) {
  const r = await api('/responses/' + id); hdr();
  const out = renderResponseHtml(r, id => '/api/admin/files/' + id);
  $.innerHTML = `<p><a href="#/s/${r.survey_id}">← ${esc(r.title)}</a></p>
    <div class="spread"><div><h1>${esc(r.name)}</h1><p class="muted">${esc(r.email)} · ${r.status === 'completed' ? 'Completado ' + fmt(r.completed_at) : 'En curso, última actividad ' + fmt(r.updated_at)}</p></div>
    <button class="danger" onclick="delResp(${r.id},${r.survey_id})">Eliminar respuesta</button></div>
    <div id="sharebox"></div>
    <div class="card">${out}</div>`;
  shareBox(r);
}
function shareBox(r) {
  const box = document.getElementById('sharebox');
  if (!r.share_token) {
    box.innerHTML = `<div class="card" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div style="flex:1;min-width:220px"><b>Compartir esta respuesta</b><div class="muted">Crea un enlace público de solo lectura: cualquiera que lo tenga puede verla, sin iniciar sesión.</div></div><button class="primary" onclick="shareResp(${r.id})">🔗 Crear enlace para compartir</button></div>`;
    return;
  }
  const url = location.origin + '/r/' + r.share_token;
  box.innerHTML = `<div class="card"><b>🔗 Enlace público activo</b>
    <div class="row" style="margin:10px 0"><input type="text" readonly value="${esc(url)}" onclick="this.select()" style="flex:1;min-width:240px"><button class="primary" onclick="copy('${esc(url)}',this)">Copiar enlace</button><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Abrir</a></div>
    <div class="muted" style="margin-bottom:8px">Quien tenga este enlace puede ver las respuestas (sin el correo del cliente) y descargar sus archivos. Puedes desactivarlo cuando quieras.</div>
    <button class="danger sm" onclick="unshareResp(${r.id})">Dejar de compartir</button></div>`;
}
async function shareResp(id) { await api('/responses/' + id + '/share', { method: 'POST' }); viewResponse(id); }
async function unshareResp(id) { if (confirm('¿Dejar de compartir? El enlace actual dejará de funcionar para todos.')) { await api('/responses/' + id + '/share', { method: 'DELETE' }); viewResponse(id); } }
async function delResp(id, sid) { if (confirm('¿Eliminar esta respuesta y sus archivos? No se puede deshacer.')) { await api('/responses/' + id, { method: 'DELETE' }); location.hash = '#/s/' + sid; } }

/* ---------- editor de preguntas ---------- */
let ed = null;
const TYPES = { text: 'Texto corto', textarea: 'Texto largo', project: 'Proyectos (fichas con varios campos)', qa: 'Pregunta y respuesta (cuadro dividido)', email: 'Correo', phone: 'Teléfono', number: 'Número', url: 'Enlace (URL)', date: 'Fecha', radio: 'Opción única', checkbox: 'Casillas (varias)', file: 'Subir archivo' };
async function viewEdit(id) {
  ed = await api('/surveys/' + id); hdr(); drawEditor();
}
function drawEditor() {
  const items = ed.schema.items;
  $.innerHTML = `<p><a href="#/" style="color:var(--brand)">← Cuestionarios</a></p>
  <div class="card"><div class="row"><div style="flex:2;min-width:220px"><label class="s">Título</label><input type="text" id="t" value="${esc(ed.title)}"></div>
    <div style="flex:1;min-width:180px"><label class="s">Enlace (/s/…)</label><input type="text" id="sl" value="${esc(ed.slug)}"></div></div>
    <label class="s">Mensaje de agradecimiento (pantalla final y correo al cliente)</label><textarea id="th">${esc(ed.thanks_message)}</textarea>
    <label class="row" style="margin-top:8px"><input type="checkbox" id="pub" ${ed.published ? 'checked' : ''}> Cuestionario activo (si lo pausas, el enlace deja de funcionar)</label></div>
  <div id="items">${items.map(itemHtml).join('')}</div>
  <div class="row"><button onclick="addItem('question')">+ Pregunta</button><button onclick="addItem('section')">+ Sección (nuevo paso)</button><button onclick="addItem('info')">+ Texto informativo</button></div><br>
  <div class="row"><button class="primary" onclick="saveEd()">Guardar cambios</button><span id="ok" class="muted"></span><span style="flex:1"></span><button class="danger" onclick="delSurvey()">Eliminar cuestionario</button></div>`;
}
function itemHtml(it, i) {
  const ctrl = `<div class="row" style="margin-top:8px"><button class="sm" onclick="mv(${i},-1)">↑</button><button class="sm" onclick="mv(${i},1)">↓</button><button class="sm danger" onclick="rm(${i})">Quitar</button></div>`;
  if (it.kind === 'section') return `<div class="item" style="border-color:var(--brand)"><label class="s">SECCIÓN (cada sección es un paso del cuestionario)</label><input type="text" value="${esc(it.title)}" oninput="ed.schema.items[${i}].title=this.value">${ctrl}</div>`;
  if (it.kind === 'info') return `<div class="item"><label class="s">TEXTO INFORMATIVO</label><textarea oninput="ed.schema.items[${i}].text=this.value">${esc(it.text)}</textarea>${ctrl}</div>`;
  if (it.kind === 'page') return `<div class="item"><label class="s">Salto de página</label>${ctrl}</div>`;
  const hasOpts = it.type === 'radio' || it.type === 'checkbox';
  return `<div class="item"><div class="grid"><div><label class="s">Pregunta</label><input type="text" value="${esc(it.label)}" oninput="ed.schema.items[${i}].label=this.value"></div>
    <div><label class="s">Tipo</label><select onchange="ed.schema.items[${i}].type=this.value;drawEditor()">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${it.type === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
    ${hasOpts ? `<label class="s">Opciones (una por línea)</label><textarea oninput="ed.schema.items[${i}].options=this.value.split('\\n').map(s=>s.trim()).filter(Boolean)">${esc((it.options || []).join('\n'))}</textarea>
      <label class="row"><input type="checkbox" ${it.other ? 'checked' : ''} onchange="ed.schema.items[${i}].other=this.checked"> Incluir opción "Otro" con texto libre</label>` : ''}
    ${['text', 'textarea', 'email', 'phone', 'number', 'url'].includes(it.type) ? `<label class="s">Texto de ejemplo (opcional)</label><input type="text" value="${esc(it.placeholder || '')}" oninput="ed.schema.items[${i}].placeholder=this.value">` : ''}
    <label class="row" style="margin-top:6px"><input type="checkbox" ${it.required ? 'checked' : ''} onchange="ed.schema.items[${i}].required=this.checked"> Obligatoria</label>${ctrl}</div>`;
}
function addItem(kind) {
  const base = { question: { kind: 'question', type: 'text', label: '', required: false }, section: { kind: 'section', title: '' }, info: { kind: 'info', text: '' } }[kind];
  ed.schema.items.push({ ...base }); drawEditor(); window.scrollTo(0, document.body.scrollHeight);
}
function mv(i, d) { const a = ed.schema.items, j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; drawEditor(); }
function rm(i) { if (confirm('¿Quitar este elemento? Las respuestas ya guardadas de esa pregunta se conservan en la base de datos.')) { ed.schema.items.splice(i, 1); drawEditor(); } }
async function saveEd() {
  const body = { title: t.value, slug: sl.value, thanks_message: th.value, published: pub.checked, schema: ed.schema };
  try { ed = await api('/surveys/' + ed.id, { method: 'PUT', body: JSON.stringify(body) }); document.getElementById('ok').textContent = '✓ Guardado'; drawEditorKeepMsg(); }
  catch (e) { document.getElementById('ok').textContent = '⚠ ' + e.message; }
}
function drawEditorKeepMsg() { const y = scrollY; drawEditor(); document.getElementById('ok').textContent = '✓ Guardado'; scrollTo(0, y); }
async function delSurvey() {
  if (prompt('Esto elimina el cuestionario y TODAS sus respuestas. Escribe ELIMINAR para confirmar:') === 'ELIMINAR') { await api('/surveys/' + ed.id, { method: 'DELETE' }); location.hash = '#/'; }
}

/* ---------- clientes: perfil y conexión con GHL ---------- */
function ghlPill(c) {
  if (!c.connected) return '<span class="pill off">Sin conectar</span>';
  if (c.kb_error) return '<span class="pill warn">Con error</span>';
  return '<span class="pill ok">Conectado</span>';
}
async function viewClients() {
  const { clients } = await api('/clients'); hdr();
  $.innerHTML = `<h1>Clientes</h1><p class="muted">Cada cliente tiene su perfil, sus proyectos y sus preguntas y respuestas. Aquí conectas la subcuenta de GHL de cada uno para alimentar a su agente de IA.</p>
    <div class="card" style="overflow:auto"><table><tr><th>Cliente</th><th>Correo</th><th>Cuestionarios</th><th>Proyectos</th><th>Preguntas</th><th>GHL</th><th>Última sincronización</th><th></th></tr>
    ${clients.map(c => `<tr><td>${esc(c.name)}${c.company ? `<br><span class="muted">${esc(c.company)}</span>` : ''}</td><td>${esc(c.email)}</td><td>${c.surveys}</td><td>${c.projects}</td><td>${c.faqs}</td><td>${ghlPill(c)}</td><td>${c.connected ? fmt(c.kb_synced_at) : '—'}</td><td><a class="btn sm" href="#/cliente/${c.id}">Abrir</a></td></tr>`).join('') || '<tr><td colspan="8" class="muted">Todavía no hay clientes.</td></tr>'}</table></div>`;
}
async function viewClient(id) {
  const d = await api('/clients/' + id); hdr();
  const g = d.ghl;
  $.innerHTML = `<p><a href="#/clientes" style="color:var(--brand)">← Clientes</a></p>
    <div class="spread"><div><h1>${esc(d.client.name)}</h1><p class="muted">${d.client.company ? esc(d.client.company) + ' · ' : ''}${esc(d.client.email)}</p></div><div class="row"><a class="btn sm" href="/api/admin/clients/${id}/ver-empresa" target="_blank" rel="noopener" title="Abre Mi empresa como la ve este cliente; lo que edites queda guardado en su perfil">Ver empresa</a>${ghlPill({ connected: g.connected, kb_error: g.error })}<button class="sm" onclick="renameClient(${id},'${esc(d.client.company || '').replace(/'/g, '')}')">Editar nombre y empresa</button><button class="danger sm" onclick="delClient(${id},'${esc(d.client.name).replace(/'/g, '')}')">Eliminar cliente</button></div></div>
    <div class="card"><h2>Conexión con la subcuenta de GHL</h2>
      <p class="muted" style="margin:0 0 10px">Pega el token de API (Private Integration) y el Location ID de la subcuenta de este cliente. Necesita permisos de <b>knowledge-bases</b> (lectura y escritura). El token se guarda cifrado y no se vuelve a mostrar.</p>
      <div class="row"><div style="flex:2;min-width:240px"><label class="s">Token de API</label><input type="password" id="gtok" autocomplete="off" placeholder="${g.hasToken ? '•••••••• guardado (déjalo vacío para conservarlo)' : 'pega aquí el token'}"></div>
        <div style="flex:1;min-width:200px"><label class="s">Location ID</label><input type="text" id="gloc" value="${esc(g.locationId)}" placeholder="ID de la subcuenta"></div></div>
      <div class="row" style="margin-top:12px"><button class="primary" id="gsave" onclick="saveGhl(${id})">Guardar y probar conexión</button>
        ${g.hasToken ? `<button onclick="syncNow(${id},this)">Sincronizar ahora</button><button class="danger" onclick="unlinkGhl(${id})">Desconectar</button>` : ''}</div>
      <div id="gmsg" style="margin-top:10px">${g.connected ? `<span class="muted">Base de conocimientos seleccionada: <code>${esc(g.kbId)}</code> · ${g.dirty ? 'cambios pendientes de enviar · ' : ''}última sincronización: ${esc(fmt(g.syncedAt))}</span>` : ''}${g.error ? `<div class="err" style="margin-top:6px">${esc(g.error)}</div>` : ''}</div>
      <div id="kbsel"></div></div>
    <div class="card"><h2>Página de proyectos para el Web crawler</h2>
      <p class="muted" style="margin:0 0 8px">Esta es la página de texto con todos los proyectos del cliente. Se registra sola en el Web crawler de su base de conocimientos y se vuelve a leer cuando el cliente cambia algo.</p>
      <div class="row"><input type="text" readonly value="${esc(d.kbUrl)}" onclick="this.select()" style="flex:1;min-width:260px"><button onclick="copy('${esc(d.kbUrl)}',this)">Copiar</button><a class="btn" href="${esc(d.kbUrl)}" target="_blank" rel="noopener">Abrir</a></div></div>
    <div class="card"><div class="spread" style="align-items:flex-start"><h2 style="margin:0">Documentos de los proyectos (${d.docs.length})</h2>
      <button type="button" id="kbsw" class="kbsw ${g.kbDocs ? 'on' : 'off'}" role="switch" aria-checked="${!!g.kbDocs}" onclick="toggleKbDocs(${id}, this)" title="Incluir esta lista de documentos en la base de conocimientos del agente"><span class="dot"></span><span class="lbl">${g.kbDocs ? 'Activo' : 'Inactivo'}</span></button></div>
      <p class="muted" style="margin:6px 0 10px">Archivos que el cliente subió, con la descripción que les puso. Cada uno tiene un código que usará la herramienta de envío del agente.</p>
      <p class="muted" style="margin:0 0 10px"><b>Activo</b> = el agente de este cliente conoce esta lista de documentos y los ofrece. Actívalo solo cuando la herramienta de envío ya esté configurada en su agente, para que no ofrezca documentos que no puede enviar.</p>
      ${d.docs.length ? d.docs.map(f => `<div class="ans"><div class="l">${esc(f.code)} · ${f.description ? esc(f.description) : '<span style="color:var(--warn)">⚠ falta descripción</span>'}</div><div class="a muted" style="font-size:13px">${esc(f.project)} · ${esc(f.filename)} (${f.size >= 1048576 ? (f.size / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(f.size / 1024)) + ' KB'}) · <a href="/api/admin/files/${f.id}">Descargar</a> · <a href="#" onclick="editDocDesc(${f.id}, ${id}, this.dataset.d); return false" data-d="${esc(f.description)}">Editar descripción</a></div></div>`).join('') : '<p class="muted">Todavía no hay documentos.</p>'}</div>
    <div class="card"><h2>Herramienta de envío para el agente</h2>
      <p class="muted" style="margin:0 0 10px">Permite que el agente de IA de este cliente envíe documentos (brochure, planos…) por el mismo chat donde habla con el cliente. Se configura en GHL como un <b>Custom API</b>: copia estos valores. No necesita autenticación: la clave secreta va dentro de la dirección.</p>
      ${copyBlock('Dirección (Endpoint URL) · método POST', d.agent.url)}
      <div class="muted" style="font-size:13px;margin:4px 0 10px">Content-Type: <b>application/json</b> · Autenticación: <b>apagada</b> · <b>Use a raw JSON body: APAGADO</b> · Query parameter: <b>contactId</b> = <code>{{contact.id}}</code> <span>(confirma en tu GHL el nombre de la variable del contacto)</span></div>
      ${fieldsBlock()}
      ${copyBlock('¿Cuándo debe usarse la acción? (When should the action take place)', AGENT_WHEN)}
      ${copyBlock('Qué decir después de ejecutarla (What to say after)', AGENT_AFTER)}
      <div class="row" style="margin-top:12px"><button class="primary" onclick="checkPerms(${id}, this)">Probar permisos del token</button><button onclick="regenKey(${id})">Regenerar clave</button></div>
      <div id="permres" style="margin-top:10px"></div>
      <div class="spread" style="margin-top:18px"><h2 style="margin:0">Llamadas recientes del agente (${d.agent.calls.length})</h2><button class="sm" onclick="viewClient(${id})">Actualizar</button></div>
      <p class="muted" style="margin:4px 0 8px">Cada vez que el agente usa la herramienta queda aquí, envíe o no. Muestra lo que pidió y lo que Encuesty le respondió.</p>
      ${d.agent.calls.length ? '<div style="overflow:auto"><table><tr><th>Fecha</th><th>Contacto</th><th>Lo que pidió</th><th>Qué respondió Encuesty</th><th>ms</th></tr>' + d.agent.calls.map(x => {
        const r = x.resp || {}, l = a => (a || []).map(esc).join('; ');
        const det = [r.enviados && r.enviados.length ? 'Enviados: ' + l(r.enviados) : '', r.fallidos && r.fallidos.length ? 'Fallidos: ' + l(r.fallidos) : '', r.no_encontrados && r.no_encontrados.length ? 'No encontró: ' + l(r.no_encontrados) : '', r.ambiguos && r.ambiguos.length ? 'Ambiguos: ' + l(r.ambiguos.map(z => typeof z === 'string' ? z : (z.pedido + (z.opciones ? ' (¿' + z.opciones.join(' / ') + '?)' : '')))) : '', r.disponibles ? 'Le ofreció ' + r.disponibles + ' documento(s) disponibles' : '', r.canal ? 'Canal: ' + esc(r.canal) : ''].filter(Boolean).join('<br>');
        const cls = ['enviado', 'enviando', 'parcial', 'ya_enviado'].includes(x.estado) ? 'ok' : x.estado === 'error' || x.estado === 'sin_conexion' ? 'warn' : 'off';
        return `<tr><td>${esc(fmt(x.created_at))}</td><td><code>${esc(x.contact_id || '—')}</code></td><td>${esc(x.asked || '—')}${x.project ? `<div class="muted">Proyecto: ${esc(x.project)}</div>` : ''}</td><td><span class="pill ${cls}">${esc(x.estado)}</span>${r.mensaje ? `<div style="font-size:12px;margin-top:4px">${esc(r.mensaje)}</div>` : ''}${det ? `<div class="muted" style="font-size:12px;margin-top:2px">${det}</div>` : ''}</td><td>${x.ms ?? ''}</td></tr>`;
      }).join('') + '</table></div>' : '<p class="muted">Todavía el agente no ha usado la herramienta.</p>'}
      <h2 style="margin-top:18px">Envíos recientes (${d.agent.sends.length})</h2>
      ${d.agent.sends.length ? '<div style="overflow:auto"><table><tr><th>Fecha</th><th>Contacto</th><th>Documento</th><th>Canal</th><th>Estado</th></tr>' + d.agent.sends.map(x => `<tr><td>${esc(fmt(x.created_at))}</td><td><code>${esc(x.contact_id)}</code></td><td>${esc(x.code)} · ${esc(x.description)}</td><td>${esc(x.channel)}</td><td><span class="pill ${x.status === 'enviado' ? 'ok' : x.status === 'error' ? 'warn' : 'off'}">${esc(x.status)}</span>${x.error ? `<div class="err" style="font-size:12px">${esc(x.error)}</div>` : ''}</td></tr>`).join('') + '</table></div>' : '<p class="muted">Aún no se ha enviado ningún documento.</p>'}</div>
    <div class="card"><h2>Proyectos (${d.projects.length})</h2>${d.projects.length ? d.projects.map(p => `<div style="margin:10px 0 14px"><div class="muted" style="font-size:12px">Origen: ${esc(p.origin)}</div><div style="white-space:pre-wrap">${esc(p.text)}</div></div>`).join('') : '<p class="muted">Sin proyectos todavía.</p>'}</div>
    <div class="card"><h2>Preguntas y respuestas (${d.faqs.length})</h2>${d.faqs.length ? d.faqs.map(f => `<div class="ans"><div class="l">${esc(f.question)} <span class="pill ${f.state === 'synced' ? 'ok' : f.state === 'local' ? 'off' : 'warn'}">${{ synced: 'En GHL', pending: 'Pendiente', error: 'Error', local: 'Solo en Encuesty' }[f.state] || esc(f.state)}</span></div><div class="a">${esc(f.answer)}</div>${f.error ? `<div class="err">${esc(f.error)}</div>` : ''}</div>`).join('') : '<p class="muted">Sin preguntas todavía.</p>'}</div>`;
}
async function saveGhl(id, kbId) {
  const btn = document.getElementById('gsave'), msg = document.getElementById('gmsg'), sel = document.getElementById('kbsel');
  btn.disabled = true; msg.innerHTML = '<span class="muted">Probando la conexión…</span>';
  try {
    const body = { locationId: document.getElementById('gloc').value, token: document.getElementById('gtok').value };
    if (kbId) body.kbId = kbId;
    const r = await api('/clients/' + id + '/ghl', { method: 'PUT', body: JSON.stringify(body) });
    if (!r.ok) { msg.innerHTML = `<div class="err">${esc(r.error)}</div>`; sel.innerHTML = ''; }
    else {
      msg.innerHTML = `<div style="color:var(--ok);font-weight:600">✓ Conexión correcta. Se está sincronizando con la base de conocimientos «${esc(r.kbName)}».</div>`;
      sel.innerHTML = r.knowledgeBases.length > 1 ? `<div class="row" style="margin-top:10px"><label class="s" style="margin:0">Base de conocimientos</label><select id="kbpick" style="max-width:320px">${r.knowledgeBases.map(k => `<option value="${esc(k.id)}" ${k.id === r.kbId ? 'selected' : ''}>${esc(k.name)}</option>`).join('')}</select><button onclick="saveGhl(${id}, document.getElementById('kbpick').value)">Usar esta</button></div>` : '';
      document.getElementById('gtok').value = '';
    }
  } catch (e) { msg.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  btn.disabled = false;
}
const AGENT_FIELDS = [
  { name: 'documentos', required: true, desc: 'Códigos DOC-xx (lo ideal) o descripción de los documentos que pidió el cliente, separados por coma. Ej: DOC-18, DOC-21', example: 'DOC-18, DOC-21' },
  { name: 'proyecto', required: false, desc: 'Nombre del proyecto al que se refiere el cliente, si lo mencionó', example: 'Ecos Del Mar residences' },
];
function fieldsBlock() {
  const cp = (t) => `<button class="sm" data-t="${encodeURIComponent(t)}" onclick="copy(decodeURIComponent(this.dataset.t), this)">Copiar</button>`;
  return `<div style="margin:8px 0"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:3px">Data collection → pestaña «Form» → «Add new» (crea estos 2 campos)</div>` + AGENT_FIELDS.map((f, i) => `<div style="background:var(--cream);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:13px">
    <div style="font-weight:700;margin-bottom:6px">Campo ${i + 1}${f.required ? '' : ' (opcional)'}</div>
    <div class="row" style="margin:3px 0"><span style="width:120px" class="muted">Field name</span><code style="flex:1">${esc(f.name)}</code>${cp(f.name)}</div>
    <div class="row" style="margin:3px 0"><span style="width:120px" class="muted">Tipo / dónde</span><span style="flex:1"><b>String</b> · in: <b>Body</b> · Required: <b>${f.required ? 'marcado ✓' : 'sin marcar'}</b></span></div>
    <div class="row" style="margin:3px 0;align-items:flex-start"><span style="width:120px" class="muted">Description</span><span style="flex:1">${esc(f.desc)}</span>${cp(f.desc)}</div>
    <div class="row" style="margin:3px 0"><span style="width:120px" class="muted">Example</span><span style="flex:1">${esc(f.example)}</span>${cp(f.example)}</div>
    <div class="row" style="margin:3px 0"><span style="width:120px" class="muted">Enums</span><span class="muted">déjalo vacío</span></div></div>`).join('') + '</div>';
}
const AGENT_WHEN = 'Úsala cada vez que el cliente pida recibir documentos o información: brochure, planos, listado de precios, fotos, video, "la info" o "mándame la información", aunque no diga "documento". Si no dice el proyecto, usa el del anuncio. En "documentos" pasa el código DOC-xx de la lista del proyecto en la base de conocimiento; si no lo encuentras, pasa el nombre del documento (ej: brochure). Varios: sepáralos con coma. En "proyecto" pasa el nombre del proyecto.';
const AGENT_AFTER = 'Si indica que se envió o se está enviando, di "Aquí está" y que se lo mandas por este chat. Si hay varias opciones, pregunta cuál quiere, sin códigos. Si no está disponible, di que no lo tienes. Si hay error, no digas que lo enviaste: di que un asesor se lo manda. No menciones la herramienta.';
function copyBlock(label, text) {
  return `<div style="margin:8px 0"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:3px">${esc(label)}</div><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><pre style="flex:1;margin:0;white-space:pre-wrap;word-break:break-all;background:var(--cream);border-radius:10px;padding:8px 10px;font-size:12.5px;max-height:160px;overflow:auto">${esc(text)}</pre><button class="sm" data-t="${encodeURIComponent(text)}" onclick="copy(decodeURIComponent(this.dataset.t), this)">Copiar</button></div></div>`;
}
async function checkPerms(id, btn) {
  btn.disabled = true; const box = document.getElementById('permres'); box.innerHTML = '<span class="muted">Probando… (no se envía ningún mensaje)</span>';
  try {
    const r = await api('/clients/' + id + '/ghl/permisos', { method: 'POST' });
    box.innerHTML = r.error ? `<div class="err">${esc(r.error)}</div>` : r.checks.map(c => `<div>${c.ok ? '<span style="color:var(--ok)">✓</span>' : '<span style="color:var(--err)">✗</span>'} ${esc(c.name)}${c.ok ? '' : ` <span class="err">— falta el permiso (respuesta ${esc(c.estado)})</span>`}</div>`).join('');
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  btn.disabled = false;
}
async function regenKey(id) { if (confirm('¿Regenerar la clave? La dirección actual dejará de funcionar y tendrás que pegar la nueva en el agente de GHL.')) { await api('/clients/' + id + '/agent-key', { method: 'POST' }); viewClient(id); } }
async function editDocDesc(fid, cid, cur) { const n = prompt('¿Qué archivo es este? (descripción específica, máx. 150 caracteres)', cur || ''); if (n !== null && n.trim() !== (cur || '')) { await api('/files/' + fid + '/description', { method: 'PUT', body: JSON.stringify({ description: n.trim() }) }); viewClient(cid); } }
async function toggleKbDocs(id, btn) {
  const on = !btn.classList.contains('on'); btn.disabled = true;
  try {
    await api('/clients/' + id + '/kbdocs', { method: 'PUT', body: JSON.stringify({ enabled: on }) });
    btn.classList.toggle('on', on); btn.classList.toggle('off', !on); btn.setAttribute('aria-checked', String(on)); btn.querySelector('.lbl').textContent = on ? 'Activo' : 'Inactivo';
  } catch (e) { alert('No se pudo cambiar: ' + (e.message || 'error')); }
  btn.disabled = false;
}
async function syncNow(id, btn) {
  btn.disabled = true; const msg = document.getElementById('gmsg'); msg.innerHTML = '<span class="muted">Sincronizando…</span>';
  try { const r = await api('/clients/' + id + '/sync', { method: 'POST' }); msg.innerHTML = r.ok ? '<div style="color:var(--ok);font-weight:600">✓ Sincronizado.</div>' : `<div class="err">${esc(r.skipped || (r.errors || []).join(' | ') || 'No se pudo sincronizar')}</div>`; }
  catch (e) { msg.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  btn.disabled = false;
}
async function renameClient(id, curCo = '') {
  const cur = document.querySelector('h1').textContent;
  const n = prompt('Nombre de la persona (así se ve en el panel y en su perfil):', cur);
  if (n === null) return;
  const co = prompt('Nombre de la empresa (así se llama en la base de conocimientos de su agente; déjalo vacío para usar el nombre):', curCo);
  if (co === null) return;
  if (!n.trim()) return;
  await api('/clients/' + id, { method: 'PUT', body: JSON.stringify({ name: n.trim(), company: co.trim() }) }); viewClient(id);
}
async function delClient(id, name) {
  if (prompt('Esto elimina a ' + name + ' con TODAS sus respuestas, proyectos, preguntas y archivos. No se puede deshacer.\n\nEscribe ELIMINAR para confirmar:') === 'ELIMINAR') { await api('/clients/' + id, { method: 'DELETE' }); location.hash = '#/clientes'; }
}
async function unlinkGhl(id) { if (confirm('¿Desconectar la subcuenta de GHL de este cliente? Sus proyectos y preguntas se conservan en Encuesty.')) { await api('/clients/' + id + '/ghl', { method: 'DELETE' }); viewClient(id); } }

async function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  try {
    await api('/me');
    if (h[0] === 's') return viewResponses(h[1]);
    if (h[0] === 'respuestas') return viewResponse(h[1]);
    if (h[0] === 'editar') return viewEdit(h[1]);
    if (h[0] === 'clientes') return viewClients();
    if (h[0] === 'cliente') return viewClient(h[1]);
    viewList();
  } catch (e) { if (e.message !== 'auth') $.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}
window.onhashchange = route; route();
</script>
</body>
</html>
