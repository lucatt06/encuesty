<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuestionario</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafb;--card:#fff;--ink:#0e1742;--muted:#6a7287;--line:#e4e2da;--cream:#f4f1e9;--brand:#e93b74;--brand-d:#d12a62;--navy:#0e1742;--ok:#16a34a;--warn:#d97706;--err:#dc2626}
*{box-sizing:border-box}
h1,h2,.brand{font-family:'Plus Jakarta Sans',Inter,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 80px}
.brand{font-weight:800;color:var(--navy);font-size:22px;letter-spacing:-.5px;margin:6px 4px 16px}.brand b{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 10px 40px rgba(14,23,66,.07)}@media(max-width:520px){.card{padding:24px 20px;border-radius:22px}}
h1{font-size:30px;line-height:1.15;margin:0 0 10px;font-weight:800;letter-spacing:-.8px}
h2{font-size:22px;margin:0 0 16px;font-weight:700;letter-spacing:-.4px}
p.muted,.muted{color:var(--muted)}
label.q{display:block;font-weight:600;margin:22px 0 6px}
.req{color:var(--err)}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=number],input[type=date],textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:14px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt input{margin-top:4px;accent-color:var(--brand)}
.opt.on{border-color:var(--brand);background:var(--cream)}
.other-in{margin:4px 0 0 30px;width:calc(100% - 30px)}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:12px 26px}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.primary:hover{background:var(--brand-d)}
.card.center .check{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;background:var(--brand);color:#fff;font-size:40px;line-height:76px}
button:disabled{opacity:.5;cursor:default}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 2px}
section{scroll-margin-top:70px}
.pj-wrap{margin-top:14px}
.pj-card{border:1px solid var(--line);border-radius:22px;padding:22px;margin:0 0 16px;background:#fff;box-shadow:0 4px 18px rgba(14,23,66,.05);border-top:5px solid var(--brand)}
.pj-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.pj-title{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-weight:800;font-size:18px;color:var(--navy)}
.pj-l{display:block;font-weight:600;margin:16px 0 6px}
.pj-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pj-types{display:flex;gap:8px;flex-wrap:wrap}.pj-types .opt{margin:0;padding:9px 18px}
.un-head,.un-row{display:grid;grid-template-columns:1.4fr 1fr .8fr 34px;gap:8px;align-items:center}
.un-head{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.un-row{margin-bottom:8px}
.pj-x{padding:4px 12px;font-size:13px;color:var(--muted)}
.un-row .pj-x{padding:0;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1}
.pj-link{border:0;background:none;color:var(--brand);padding:4px 2px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{margin:0;padding:7px 14px;font-size:14px;border-radius:999px}
@media(max-width:620px){.pj-grid{grid-template-columns:1fr}.un-head{display:none}.un-row{grid-template-columns:1fr 1fr;padding:10px;border:1px dashed var(--line);border-radius:14px}.un-row input:first-child{grid-column:1/-1}.un-row .pj-x{justify-self:end}.un-row input{padding:10px 9px;font-size:14px}}
.qa-wrap{margin:22px 0 0}
.qa-box{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.qa-box:focus-within{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 25%,transparent)}
.qa-box textarea{display:block;border:0;border-radius:0;min-height:84px;background:transparent}
.qa-box textarea:focus{outline:none}
.qa-box textarea+textarea{border-top:1px dashed var(--line);background:var(--cream)}
.qa-box textarea::placeholder{color:#a3a8b8}
.qa-wrap.field-err .qa-box{border-color:var(--err)}
.qa-box{position:relative}.qa-extras .qa-box{margin-top:12px}
.qa-del{position:absolute;top:6px;right:8px;z-index:2;padding:0;width:26px;height:26px;line-height:22px;font-size:18px;border-radius:50%;color:var(--muted)}
.qa-add{margin-top:12px;color:var(--brand);border-color:var(--brand);padding:9px 20px}
.qa-add:hover{background:var(--cream)}
.sec-h{margin:44px 0 6px;padding-top:26px;border-top:2px solid var(--cream)}
section:first-of-type .sec-h{border-top:0;margin-top:26px}
.field-err>label.q{color:var(--err)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.saved{color:var(--ok)}
.info{background:var(--cream);padding:12px 16px;border-radius:14px}
.error{color:var(--err);font-size:14px;margin-top:6px}
.field-err input,.field-err textarea{border-color:var(--err)}
.info{color:var(--navy);margin:12px 0}
.file-list{margin:8px 0}
.file-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;margin:4px 0;font-size:14px}
.file-item button{padding:3px 10px;font-size:13px}
.center{text-align:center;padding:30px 0}
.check{font-size:46px}

/* --- fichas compactas --- */
.pj-card{padding:14px 16px 16px;margin-bottom:12px;border-radius:18px;border-top-width:4px}
.pj-head{margin-bottom:0}.pj-title{font-size:16px}
.pj-card .pj-l{margin:10px 0 3px;font-size:13px}
.pj-card input[type=text],.pj-card textarea{padding:8px 11px;font-size:14px;border-radius:10px}
.pj-card textarea{min-height:0;height:52px}
.pj-grid3{display:grid;grid-template-columns:1.3fr 1.1fr .8fr;gap:10px}
.pj-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:2px}.pj-row .pj-l{margin:0}
.pj-types{display:flex;gap:6px;flex-wrap:wrap}
.pj-card .pj-types .opt{margin:0;padding:5px 14px;font-size:14px;border-radius:999px}
.un-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.pj-link{font-size:13px;padding:0}
.un-row{grid-template-columns:1.4fr 1fr .8fr 28px;gap:6px;margin-bottom:6px}
.chips{gap:5px}
.pj-card .chip{padding:3px 11px;font-size:13px;line-height:1.5;border-radius:999px}
.pj-card .opt{position:relative}
.pj-card .opt input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.pj-card .opt:focus-within{outline:2px solid var(--brand);outline-offset:1px}
.pj-card .opt.on{background:var(--brand);border-color:var(--brand);color:#fff}
.am-other{margin-top:8px}
@media(max-width:620px){.pj-grid3{grid-template-columns:1fr}.un-row{grid-template-columns:1fr 1fr}.un-row input:first-child{grid-column:1/-1}}
.pj-media{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.pj-up{display:inline-block;cursor:pointer;border:1px dashed var(--brand);color:var(--brand);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600}
.pj-up:hover{background:var(--cream)}
.pj-card .file-list{margin:6px 0 0}.pj-card .file-item{padding:5px 10px;margin:3px 0;font-size:13px}
.pj-media{display:block;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.pj-mt{font-weight:700;font-size:14px;margin-bottom:6px}
.pj-mrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.pj-mlab{flex:0 0 92px;font-size:13px;font-weight:600;color:var(--muted)}
.pj-link-in{flex:1;min-width:0}
.pj-addlink{padding:7px 16px;font-size:14px;color:var(--brand);border-color:var(--brand)}
.link-list .file-item a{color:var(--navy);word-break:break-all}
@media(max-width:620px){.pj-mrow{flex-wrap:wrap}.pj-mlab{flex-basis:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">encuesty<b>.</b></div>
  <div id="app"><div class="card"><p class="muted">Cargando…</p></div></div>
</div>
<script>
const slug = location.pathname.split('/')[2];
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = { survey: null, steps: [], step: 0, answers: {}, files: [], name: '', completed: false, saved: '' };
let pending = {}, timer = null, saving = false;

async function api(path, opts = {}) {
  const r = await fetch('/api/s/' + slug + path, { headers: opts.body && !(opts.body instanceof FormData) ? {'Content-Type':'application/json'} : {}, credentials: 'same-origin', ...opts });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'Error'), { status: r.status, data: j });
  return j;
}

/* ---------- pasos ---------- */
function buildSteps(items) {
  const steps = []; let cur = { title: '', items: [] };
  const flush = () => { if (cur.items.some(i => i.kind === 'question' || i.kind === 'info')) steps.push(cur); };
  for (const it of items) {
    if (it.kind === 'section' || it.kind === 'page') { flush(); cur = { title: it.title || '', items: [] }; }
    else cur.items.push(it);
  }
  flush();
  while (steps.length > 1 && !steps[steps.length - 1].items.some(i => i.kind === 'question')) steps.pop();
  return steps.length ? steps : [{ title: '', items: [] }];
}

/* ---------- inicio de sesión por correo ---------- */
async function boot() {
  let info;
  try { info = await api(''); } catch (e) { return $app.innerHTML = `<div class="card center"><h2>${esc(e.message)}</h2></div>`; }
  document.title = info.title;
  state.title = info.title;
  try { const me = await api('/me'); return begin(me); } catch {}
  renderLogin(info.title);
}
function renderLogin(title, needName = false, email = '') {
  $app.innerHTML = `<div class="card">
    <h1>${esc(title)}</h1>
    <p class="muted">${needName ? 'Es tu primera vez aquí. ¿Cómo te llamas?' : 'Escribe tu correo para empezar o continuar donde te quedaste.'}</p>
    <form id="f">
      <label class="q">Correo electrónico</label>
      <input type="email" id="email" required autocomplete="email" value="${esc(email)}" ${needName ? 'readonly' : 'autofocus'} placeholder="tu@correo.com">
      ${needName ? '<label class="q">Tu nombre</label><input type="text" id="name" required autocomplete="name" autofocus placeholder="Nombre y apellido">' : ''}
      <div class="error" id="err"></div>
      <div class="nav"><span></span><button class="primary" type="submit">${needName ? 'Empezar' : 'Continuar'}</button></div>
    </form></div>`;
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const em = document.getElementById('email').value.trim();
    const nm = document.getElementById('name')?.value.trim() || '';
    const btn = ev.submitter; btn.disabled = true;
    try {
      const r = await api('/start', { method: 'POST', body: JSON.stringify({ email: em, name: nm }) });
      if (r.needName) return renderLogin(title, true, em);
      begin(r);
    } catch (e) { document.getElementById('err').textContent = e.message; btn.disabled = false; }
  };
}
function begin(r) {
  state.survey = r.survey; state.steps = buildSteps(r.survey.schema.items);
  state.steps.forEach((st, n) => st.items.forEach(i => { if (i.kind === 'question') secOf[i.id] = n; }));
  state.answers = r.answers || {}; state.files = r.files || []; state.name = r.name;
  state.step = Math.min(r.step || 0, state.steps.length - 1);
  state.completed = r.status === 'completed';
  state.thanks = r.survey.thanks;
  if (state.completed) return renderDone(true);
  render();
  if (state.step > 0) setTimeout(() => document.getElementById('sec-' + state.step)?.scrollIntoView(), 50);
}

/* ---------- render del formulario (continuo) ---------- */
function allQs() { return state.steps.flatMap(s => s.items.filter(i => i.kind === 'question')); }
function isAnswered(it) {
  if (it.type === 'file') return state.files.some(f => f.question_id === it.id);
  const v = state.answers[it.id];
  if (it.type === 'project') return Array.isArray(v) && v.some(pr => pr && String(pr.name || '').trim());
  if (it.type === 'qa') return !!(v && (typeof v === 'object' ? (String(v.q || '').trim() || String(v.a || '').trim()) : String(v).trim()));
  if (Array.isArray(v)) return v.length > 0 && !v.every(x => x === 'Otro: ');
  return v !== undefined && String(v).trim() !== '' && v !== 'Otro: ';
}
function updateProgress() {
  const qs = allQs(), done = qs.filter(isAnswered).length;
  const pct = qs.length ? Math.round(done / qs.length * 100) : 0;
  const bar = document.getElementById('pbar'), lab = document.getElementById('plabel');
  if (bar) bar.style.width = pct + '%';
  if (lab) lab.textContent = pct + '% completado';
}
function render() {
  $app.innerHTML = `<div class="sticky"><div class="bar"><i id="pbar" style="width:0"></i></div>
      <div class="meta"><span id="plabel"></span><span id="saved" class="saved">${state.saved}</span></div></div>
    <div class="card">
      <h1>${esc(state.survey.title)}</h1>
      ${state.steps.map((st, n) => `<section id="sec-${n}">${st.title ? `<h2 class="sec-h">${esc(st.title)}</h2>` : ''}${st.items.map(renderItem).join('')}</section>`).join('')}
      <div class="error" id="err"></div>
      <div class="nav"><span class="muted" style="font-size:14px">Tus respuestas se guardan solas mientras escribes.</span><button id="next" class="primary">Enviar respuestas</button></div>
    </div>`;
  bind(); updateProgress();
  document.getElementById('next').onclick = submitAll;
}
function renderItem(it) {
  if (it.kind === 'info') return `<p class="info">${esc(it.text)}</p>`;
  if (it.kind !== 'question') return '';
  const v = state.answers[it.id];
  const lab = `<label class="q" for="${it.id}">${esc(it.label)}${it.required ? ' <span class="req">*</span>' : ''}</label>`;
  const wrapS = `<div data-q="${it.id}">`, wrapE = '</div>';
  const ph = it.placeholder ? ` placeholder="${esc(it.placeholder)}"` : '';
  const types = { text: 'text', email: 'email', phone: 'tel', number: 'number', url: 'url', date: 'date' };
  if (types[it.type]) return wrapS + lab + `<input id="${it.id}" type="${types[it.type]}" data-in="${it.id}" value="${esc(v)}"${ph}>` + wrapE;
  if (it.type === 'project') return `<div data-q="${it.id}" class="pj-wrap" data-pj="${it.id}">${projectsInner(it.id)}</div>`;
  if (it.type === 'qa') {
    const q = (v && typeof v === 'object') ? v : { q: typeof v === 'string' ? v : '', a: '' };
    const last = isLastQa(it), base = qaBase(it);
    const extras = last ? (q.extra || []).map((e, i) => qaBox(it.id, 'Pregunta #' + (base + i + 1), e, true)).join('') : '';
    return `<div data-q="${it.id}" class="qa-wrap">${qaBox(it.id, it.label, q, false)}
      ${last ? `<div class="qa-extras">${extras}</div><button type="button" class="qa-add" data-qa-add="${it.id}">+ Añadir otra pregunta y respuesta</button>` : ''}</div>`;
  }
  if (it.type === 'textarea') return wrapS + lab + `<textarea id="${it.id}" data-in="${it.id}"${ph}>${esc(v)}</textarea>` + wrapE;
  if (it.type === 'radio' || it.type === 'checkbox') {
    const isC = it.type === 'checkbox', vals = isC ? (v || []) : (v ? [v] : []);
    const known = vals.filter(x => (it.options || []).includes(x));
    const otherVal = vals.find(x => typeof x === 'string' && x.startsWith('Otro: '));
    const opts = (it.options || []).filter(o => !(it.other && o.trim().toLowerCase() === 'otro')).map((o, i) => `<label class="opt ${known.includes(o) ? 'on' : ''}"><input type="${isC ? 'checkbox' : 'radio'}" name="${it.id}" data-opt="${it.id}" value="${esc(o)}" ${known.includes(o) ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('');
    const other = it.other ? `<label class="opt ${otherVal !== undefined ? 'on' : ''}"><input type="${isC ? 'checkbox' : 'radio'}" name="${it.id}" data-other-toggle="${it.id}" ${otherVal !== undefined ? 'checked' : ''}><span>Otro</span></label>
      <input type="text" class="other-in" data-other="${it.id}" placeholder="Especifica" value="${esc((otherVal || '').slice(6))}" style="${otherVal !== undefined ? '' : 'display:none'}">` : '';
    return wrapS + lab + opts + other + wrapE;
  }
  if (it.type === 'file') {
    const fs = state.files.filter(f => f.question_id === it.id);
    return wrapS + lab + `<div class="file-list" id="fl-${it.id}">${fs.map(fileRow).join('')}</div>
      <input type="file" data-file="${it.id}" ${it.multiple === false ? '' : 'multiple'}>
      <div class="muted" style="font-size:13px;margin-top:4px">Máximo 15 MB por archivo.</div>` + wrapE;
  }
  return '';
}
/* ---------- fichas de proyectos ---------- */
const AMENITIES = ['Piscina', 'Gimnasio', 'Área de BBQ / terraza', 'Club house / salón social', 'Seguridad 24/7', 'Playa privada / acceso a la playa', 'Spa / sauna', 'Cancha de pádel o tenis', 'Parque infantil', 'Coworking', 'Lobby / recepción', 'Ascensor', 'Estacionamiento', 'Planta eléctrica', 'Jardines / áreas verdes', 'Área de mascotas', 'Cine / sala de juegos', 'Campo de golf', 'Marina / muelle'];
const newUnit = () => ({ type: '', price: '', size: '' });
const uid = () => 'p' + Math.random().toString(36).slice(2, 8);
const newProject = () => ({ id: uid(), name: '', location: '', type: '', units: [newUnit()], links: [], delivery: '', payment: '', amenities: [], amenities_other: '' });
function getProjects(id) {
  let a = state.answers[id];
  if (!Array.isArray(a) || !a.length) { a = [newProject()]; state.answers[id] = a; }
  let fixed = false;
  a.forEach(p => { if (!p.id) { p.id = uid(); fixed = true; } if (!Array.isArray(p.units) || !p.units.length) p.units = [newUnit()]; if (!Array.isArray(p.amenities)) p.amenities = []; if (!Array.isArray(p.links)) p.links = []; });
  if (fixed) { pending[id] = a; schedule(); }
  return a;
}
function projectsInner(id) {
  const arr = getProjects(id);
  return arr.map((p, i) => projectCard(id, p, i)).join('') + `<button type="button" class="qa-add" data-pj-add="${id}">+ Añadir otro proyecto</button>`;
}
function projectCard(id, p, i) {
  const inp = (f, label, ph) => `<div><label class="pj-l">${label}</label><input type="text" data-p="${i}" data-f="${f}" value="${esc(p[f])}" placeholder="${esc(ph)}"></div>`;
  return `<div class="pj-card">
    <div class="pj-head"><span class="pj-title">Proyecto ${i + 1}${i === 0 ? ' · primera campaña' : ''}</span>${i > 0 ? `<button type="button" class="pj-x" data-pj-del="${i}">Quitar proyecto</button>` : ''}</div>
    <div class="pj-grid3">${inp('name', 'Nombre del proyecto', 'Ej: Torre Marina')}${inp('location', 'Ubicación', 'Ciudad, zona o dirección')}${inp('delivery', 'Fecha de entrega', 'Ej: Dic 2027')}</div>
    <div class="pj-row"><label class="pj-l">Tipo de proyecto</label>
      <div class="pj-types">${['Villas', 'Apartamentos', 'Ambos'].map(t => `<label class="opt ${p.type === t ? 'on' : ''}"><input type="radio" name="pjt-${id}-${i}" data-p="${i}" data-f="type" value="${t}" ${p.type === t ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div></div>
    <div class="un-top"><label class="pj-l">Tipos de unidad, precio y metraje</label><button type="button" class="pj-link" data-un-add="${i}">+ Añadir tipo de unidad</button></div>
    <div class="muted" style="font-size:12px;margin:0 0 6px">Una fila por cada tipo de unidad. Ejemplo: una fila para el de 2 habitaciones y otra para el de 3.</div>
    ${p.units.map((u, j) => `<div class="un-row">
      <input type="text" data-p="${i}" data-u="${j}" data-uf="type" value="${esc(u.type)}" placeholder="Tipo de unidad · Ej: Apto 2 hab" aria-label="Tipo de unidad">
      <input type="text" data-p="${i}" data-u="${j}" data-uf="price" value="${esc(u.price)}" placeholder="Precio (USD)" aria-label="Precio">
      <input type="text" data-p="${i}" data-u="${j}" data-uf="size" value="${esc(u.size)}" placeholder="Metraje (95 m²)" aria-label="Metraje">
      ${p.units.length > 1 ? `<button type="button" class="pj-x" data-un-del="${i}:${j}" aria-label="Quitar esta unidad">×</button>` : '<span></span>'}</div>`).join('')}
    <label class="pj-l">Plan de pago</label>
    <textarea rows="2" data-p="${i}" data-f="payment" placeholder="Ej: Monto de reserva USD 1,000 · Separación 10% · Durante construcción 30% · Contra entrega 60%">${esc(p.payment)}</textarea>
    <label class="pj-l">Amenidades <span class="muted" style="font-weight:400">(toca las que tiene)</span></label>
    <div class="chips">${AMENITIES.map(a => `<label class="opt chip ${p.amenities.includes(a) ? 'on' : ''}"><input type="checkbox" data-p="${i}" data-am="1" value="${esc(a)}" ${p.amenities.includes(a) ? 'checked' : ''}><span>${esc(a)}</span></label>`).join('')}</div>
    <input type="text" class="am-other" data-p="${i}" data-f="amenities_other" value="${esc(p.amenities_other)}" placeholder="Otras amenidades (menciona las que no estén en la lista)" aria-label="Otras amenidades">
    <div class="pj-media">
      <div class="pj-mt">Brochures, listado de precios, planos o fotos</div>
      <div class="pj-mrow"><span class="pj-mlab">Subir</span><label class="pj-up">📎 Elegir archivos<input type="file" multiple hidden data-file="${esc(id + '#' + p.id)}"></label></div>
      <div class="file-list" id="fl-${esc(id + '#' + p.id)}">${state.files.filter(f => f.question_id === id + '#' + p.id).map(fileRow).join('')}</div>
      <div class="pj-mrow"><span class="pj-mlab">Pegar enlace</span><input type="text" class="pj-link-in" data-linkin="${i}" placeholder="https://drive.google.com/… (Drive, Dropbox, YouTube, etc.)" aria-label="Pegar enlace"><button type="button" class="pj-addlink" data-link-add="${i}">Añadir</button></div>
      <div class="link-list">${p.links.map((l, k) => `<div class="file-item"><span>🔗 <a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a></span><button type="button" data-link-del="${i}:${k}">Quitar</button></div>`).join('')}</div>
    </div>
  </div>`;
}
function bindProjects() {
  document.querySelectorAll('[data-pj]').forEach(root => {
    const id = root.dataset.pj;
    const redraw = (focusSel) => { root.innerHTML = projectsInner(id); bind(); if (focusSel) root.querySelector(focusSel)?.focus(); };
    root.oninput = root.onchange = e => {
      const t = e.target; if (t.dataset.p === undefined) return;
      const arr = getProjects(id), p = arr[+t.dataset.p];
      if (t.dataset.uf) p.units[+t.dataset.u][t.dataset.uf] = t.value;
      else if (t.dataset.am !== undefined) { const set = new Set(p.amenities); t.checked ? set.add(t.value) : set.delete(t.value); p.amenities = [...set]; t.closest('.opt').classList.toggle('on', t.checked); }
      else if (t.dataset.f === 'type') { p.type = t.value; root.querySelectorAll(`[name="${t.name}"]`).forEach(r => r.closest('.opt').classList.toggle('on', r.checked)); }
      else p[t.dataset.f] = t.value;
      setAns(id, arr);
    };
    const addLink = (i) => {
      const arr = getProjects(id), inp = root.querySelector(`[data-linkin="${i}"]`); let v = (inp.value || '').trim(); if (!v) return;
      if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = 'https://' + v;
      try { const u = new URL(v); if (!/^https?:$/.test(u.protocol) || !u.hostname.includes('.')) throw 0; v = u.href; }
      catch { inp.style.borderColor = 'var(--err)'; inp.focus(); return; }
      arr[i].links.push(v); setAns(id, arr); redraw(`[data-linkin="${i}"]`);
    };
    root.onkeydown = e => { if (e.key === 'Enter' && e.target.dataset.linkin !== undefined) { e.preventDefault(); addLink(+e.target.dataset.linkin); } };
    root.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      const arr = getProjects(id);
      if (b.dataset.linkAdd !== undefined) return addLink(+b.dataset.linkAdd);
      if (b.dataset.linkDel) { const [i, k] = b.dataset.linkDel.split(':').map(Number); arr[i].links.splice(k, 1); setAns(id, arr); return redraw(); }
      if (b.dataset.pjAdd) { arr.push(newProject()); setAns(id, arr); redraw(`.pj-card:last-of-type [data-f=name]`); }
      else if (b.dataset.pjDel) {
        const pr = arr[+b.dataset.pjDel], fs = state.files.filter(f => f.question_id === id + '#' + pr.id);
        if (confirm('¿Quitar este proyecto' + (fs.length ? ', su información y sus ' + fs.length + ' archivo(s)' : ' y su información') + '?')) {
          Promise.all(fs.map(f => api('/file/' + f.id, { method: 'DELETE' }).catch(() => {}))).then(() => {
            state.files = state.files.filter(f => f.question_id !== id + '#' + pr.id);
            arr.splice(arr.indexOf(pr), 1); setAns(id, arr); redraw(); updateProgress();
          });
        }
      }
      else if (b.dataset.unAdd !== undefined) { const i = +b.dataset.unAdd; arr[i].units.push(newUnit()); setAns(id, arr); redraw(`.pj-card:nth-of-type(${i + 1}) .un-row:last-of-type input`); }
      else if (b.dataset.unDel) { const [i, j] = b.dataset.unDel.split(':').map(Number); arr[i].units.splice(j, 1); setAns(id, arr); redraw(); }
    };
  });
}
function qaBox(id, ph, v, removable) {
  v = v || {};
  return `<div class="qa-box">${removable ? '<button type="button" class="qa-del" data-qa-del title="Quitar" aria-label="Quitar esta pregunta">×</button>' : ''}
    <textarea data-qa="${id}" data-part="q" aria-label="${esc(ph)}" placeholder="${esc(ph)}">${esc(v.q)}</textarea>
    <textarea data-qa="${id}" data-part="a" aria-label="Tu respuesta" placeholder="Tu respuesta (lo que respondes a esta pregunta)">${esc(v.a)}</textarea></div>`;
}
function isLastQa(it) {
  for (const st of state.steps) { const i = st.items.indexOf(it); if (i >= 0) { const n = st.items[i + 1]; return !(n && n.kind === 'question' && n.type === 'qa'); } }
  return true;
}
const qaBase = it => { const m = /#(\d+)/.exec(it.label); return m ? +m[1] : 1; };
function collectQA(id) {
  const boxes = [...document.querySelector(`[data-q="${id}"]`).querySelectorAll('.qa-box')];
  const val = b => ({ q: b.querySelector('[data-part=q]').value, a: b.querySelector('[data-part=a]').value });
  const obj = val(boxes[0]), extra = boxes.slice(1).map(val);
  if (extra.length) obj.extra = extra;
  setAns(id, obj);
}
const fileRow = f => `<div class="file-item"><span>📎 ${esc(f.filename)} <span class="muted">(${(f.size/1024).toFixed(0)} KB)</span></span><button type="button" data-delfile="${f.id}">Quitar</button></div>`;

function bind() {
  bindProjects();
  document.querySelectorAll('[data-qa]').forEach(el => el.oninput = () => collectQA(el.dataset.qa));
  document.querySelectorAll('[data-qa-add]').forEach(btn => btn.onclick = () => {
    const id = btn.dataset.qaAdd, wrap = btn.closest('.qa-wrap'), ex = wrap.querySelector('.qa-extras');
    const it = findQ(id), n = wrap.querySelectorAll('.qa-box').length;
    ex.insertAdjacentHTML('beforeend', qaBox(id, 'Pregunta #' + (qaBase(it) + n), {}, true));
    bind(); ex.lastElementChild.querySelector('textarea').focus();
  });
  document.querySelectorAll('[data-qa-del]').forEach(btn => btn.onclick = () => {
    const wrap = btn.closest('.qa-wrap'), id = wrap.dataset.q; btn.closest('.qa-box').remove();
    wrap.querySelectorAll('.qa-extras .qa-box').forEach((b, i) => { b.querySelector('[data-part=q]').placeholder = 'Pregunta #' + (qaBase(findQ(id)) + i + 1); });
    collectQA(id);
  });
  document.querySelectorAll('[data-in]').forEach(el => el.oninput = () => setAns(el.dataset.in, el.value));
  document.querySelectorAll('[data-opt],[data-other-toggle],[data-other]').forEach(el => el.onchange = el.oninput = () => collectChoice((el.dataset.opt || el.dataset.otherToggle || el.dataset.other)));
  document.querySelectorAll('[data-file]').forEach(el => el.onchange = () => uploadFiles(el));
  document.querySelectorAll('[data-delfile]').forEach(el => el.onclick = () => delFile(el.dataset.delfile));
}
function collectChoice(qid) {
  const it = findQ(qid), isC = it.type === 'checkbox';
  const root = document.querySelector(`[data-q="${qid}"]`);
  let vals = [...root.querySelectorAll('[data-opt]:checked')].map(e => e.value);
  const tog = root.querySelector('[data-other-toggle]'), oin = root.querySelector('[data-other]');
  if (tog) {
    oin.style.display = tog.checked ? '' : 'none';
    if (tog.checked) vals.push('Otro: ' + oin.value.trim());
  }
  root.querySelectorAll('.opt').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
  setAns(qid, isC ? vals : (vals[0] || ''));
}
const findQ = id => state.steps.flatMap(s => s.items).find(i => i.id === id);
const secOf = {};
function setAns(id, v) {
  state.answers[id] = v; pending[id] = v;
  if (secOf[id] !== undefined) state.step = secOf[id];
  document.querySelector(`[data-q="${id}"]`)?.classList.remove('field-err');
  updateProgress(); schedule();
}

/* ---------- guardado automático ---------- */
function schedule() { setSaved('Guardando…'); clearTimeout(timer); timer = setTimeout(flushSave, 700); }
function setSaved(t) { state.saved = t; const e = document.getElementById('saved'); if (e) e.textContent = t; }
async function flushSave(step) {
  clearTimeout(timer);
  if (saving) { timer = setTimeout(flushSave, 300); return; }
  const batch = pending; pending = {};
  if (!Object.keys(batch).length && step === undefined) return setSaved('✓ Guardado');
  saving = true;
  try {
    await api('/answers', { method: 'PUT', body: JSON.stringify({ answers: batch, step: step ?? state.step }) });
    setSaved('✓ Guardado automáticamente');
  } catch (e) {
    pending = { ...batch, ...pending };
    if (e.status === 401) return renderLogin(state.title);
    setSaved('⚠ Sin conexión, reintentando…'); timer = setTimeout(flushSave, 3000);
  } finally { saving = false; }
}
window.addEventListener('beforeunload', () => {
  if (Object.keys(pending).length) navigator.sendBeacon && fetch('/api/s/' + slug + '/answers', { method: 'PUT', keepalive: true, headers: {'Content-Type':'application/json'}, body: JSON.stringify({ answers: pending, step: state.step }) });
});

/* ---------- archivos ---------- */
function xhrUpload(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest(), fd = new FormData(); fd.append('file', file);
    x.open('POST', url); x.withCredentials = true;
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100)); };
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch {} x.status >= 200 && x.status < 300 ? resolve(j) : reject(new Error(j.error || 'No se pudo subir el archivo.')); };
    x.onerror = () => reject(new Error('Se perdió la conexión. Inténtalo de nuevo.'));
    x.send(fd);
  });
}
async function uploadFiles(input) {
  const qid = input.dataset.file, list = document.getElementById('fl-' + qid), files = [...input.files];
  input.value = '';
  for (const file of files) {
    const row = document.createElement('div'); row.className = 'file-item'; row.textContent = 'Subiendo ' + file.name + '… 0%'; list.appendChild(row);
    try {
      const r = await xhrUpload('/api/s/' + slug + '/upload/' + encodeURIComponent(qid), file, pct => { row.textContent = 'Subiendo ' + file.name + '… ' + pct + '%'; });
      state.files.push(r.file); row.outerHTML = fileRow(r.file); updateProgress();
    } catch (e) { row.textContent = '⚠ ' + file.name + ': ' + e.message; row.style.color = 'var(--err)'; }
  }
  bind();
}
async function delFile(id) {
  await api('/file/' + id, { method: 'DELETE' });
  state.files = state.files.filter(f => String(f.id) !== String(id));
  document.querySelector(`[data-delfile="${id}"]`)?.closest('.file-item')?.remove(); updateProgress();
}

/* ---------- envío y validación ---------- */
async function submitAll() {
  const err = document.getElementById('err');
  document.querySelectorAll('.field-err').forEach(e => e.classList.remove('field-err'));
  const miss = allQs().filter(it => it.required && !isAnswered(it));
  if (miss.length) {
    miss.forEach(m => document.querySelector(`[data-q="${m.id}"]`)?.classList.add('field-err'));
    err.textContent = miss.length === 1 ? 'Falta responder una pregunta obligatoria (*). La marqué en rojo.' : `Faltan ${miss.length} preguntas obligatorias (*). Las marqué en rojo.`;
    return document.querySelector(`[data-q="${miss[0].id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  const btn = document.getElementById('next'); btn.disabled = true; err.textContent = '';
  await flushSave(state.step);
  try { await api('/complete', { method: 'POST' }); state.completed = true; renderDone(false); }
  catch (e) { err.textContent = e.message; btn.disabled = false; }
}
function renderDone(back) {
  $app.innerHTML = `<div class="card center"><div class="check">✓</div>
    <h2>${back ? 'Ya completaste este cuestionario' : '¡Gracias, ' + esc(state.name) + '!'}</h2>
    <p class="muted">${esc(state.thanks || '')}</p>
    <p><button id="edit">Revisar o editar mis respuestas</button></p></div>`;
  document.getElementById('edit').onclick = () => { state.completed = false; render(); window.scrollTo({ top: 0 }); };
}
boot();
</script>
</body>
